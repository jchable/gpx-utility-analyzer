# Docker Compose — Development / Testing (SQLite)
# Usage: docker compose up --build

services:
  api:
    build:
      context: .
      dockerfile: ui/api/Dockerfile
    container_name: gpx-api
    ports:
      - "5000:5000"
    volumes:
      - api-data:/app/data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - Database__Provider=sqlite
      - Database__ConnectionStrings__Sqlite=Data Source=/app/data/gpxanalyzer.db
      - Storage__GpxDirectory=/app/data/gpx
      # AI Provider — configure as needed
      - AiProvider__Name=openai
      - AiProvider__ApiKey=${AI_API_KEY:-}
      - AiProvider__Model=${AI_MODEL:-}
      # Integrations — configure as needed
      - Integrations__Strava__ClientId=${STRAVA_CLIENT_ID:-}
      - Integrations__Strava__ClientSecret=${STRAVA_CLIENT_SECRET:-}
      # DEM elevation data directory
      - Storage__DemDirectory=/app/data/dem
      # Routing — uncomment and configure for route editing
      # - Routing__Provider=ors
      # - Routing__Ors__ApiKey=${ORS_API_KEY:-}
      # - Routing__Ors__BaseUrl=https://api.openrouteservice.org
      # For self-hosted OSRM, uncomment the osrm service below and use:
      # - Routing__Provider=osrm
      # - Routing__Osrm__BaseUrl=http://osrm:5000
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: ui/client/Dockerfile
    container_name: gpx-client
    ports:
      - "8081:80"
    depends_on:
      - api
    restart: unless-stopped

  # --- OSRM routing service (optional, uncomment to enable) ---
  # To use OSRM, download an OSM extract and preprocess it:
  #   docker run -t -v osrm-data:/data ghcr.io/project-osrm/osrm-backend osrm-extract -p /opt/foot.lua /data/region.osm.pbf
  #   docker run -t -v osrm-data:/data ghcr.io/project-osrm/osrm-backend osrm-partition /data/region.osrm
  #   docker run -t -v osrm-data:/data ghcr.io/project-osrm/osrm-backend osrm-customize /data/region.osrm
  # Then uncomment the service below:
  # osrm:
  #   image: ghcr.io/project-osrm/osrm-backend
  #   container_name: gpx-osrm
  #   command: osrm-routed --algorithm mld /data/region.osrm
  #   volumes:
  #     - osrm-data:/data
  #   ports:
  #     - "5001:5000"
  #   restart: unless-stopped

volumes:
  api-data:
  # osrm-data:

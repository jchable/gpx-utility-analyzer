name: DCO

# Verifies that every commit in a pull request carries a
# `Signed-off-by:` trailer (Developer Certificate of Origin).
# Contributors sign off with:  git commit -s

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          echo "Checking commits in range ${BASE_SHA}..${HEAD_SHA}"
          failed=0
          # Iterate over the commits introduced by this PR (excluding merge commits)
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            subject=$(git log -1 --format='%s' "$sha")
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # A valid sign-off line matching the commit author (case-insensitive)
            if git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "✅ $sha  $subject"
            else
              echo "❌ $sha  $subject"
              echo "     missing 'Signed-off-by' trailer (author: $author)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a DCO sign-off."
            echo "Fix with:  git rebase --signoff ${BASE_SHA}   &&   git push --force-with-lease"
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi
          echo "All commits are signed off. 🎉"

name: DCO

# Verifies that every commit in a pull request carries a
# `Signed-off-by:` trailer (Developer Certificate of Origin).
# Contributors sign off with:  git commit -s

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  check:
    name: Check sign-off
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Signed-off-by on all commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # Commits up to and including this one predate the sign-off habit. They can
          # never be repaired: signing them means rewriting history, and both `dev` and
          # `main` refuse force-pushes. Enforcing on them would leave the promotion PR
          # permanently red with no action available to anyone, so they are exempt.
          # .githooks/prepare-commit-msg is what stops this recurring; never move this
          # SHA forward to excuse a new commit.
          DCO_EXEMPT_THROUGH: 392b1ec7b109fbd8153cf73fd27c9a6db542e5d7
        run: |
          set -euo pipefail
          echo "Checking commits in range ${BASE_SHA}..${HEAD_SHA}"
          failed=0
          # Iterate over the commits introduced by this PR (excluding merge commits)
          for sha in $(git rev-list --no-merges "${BASE_SHA}..${HEAD_SHA}"); do
            subject=$(git log -1 --format='%s' "$sha")
            author="$(git log -1 --format='%an <%ae>' "$sha")"
            # Pre-enforcement history. Fail closed: if the exempt commit is not in this
            # checkout we cannot prove a commit predates it, so we check it normally.
            if git rev-parse -q --verify "${DCO_EXEMPT_THROUGH}^{commit}" >/dev/null &&
               git merge-base --is-ancestor "$sha" "${DCO_EXEMPT_THROUGH}"; then
              echo "⏭️  $sha  $subject"
              echo "     predates DCO enforcement, exempt"
              continue
            fi
            # A valid sign-off line matching the commit author (case-insensitive)
            if git log -1 --format='%B' "$sha" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "✅ $sha  $subject"
            else
              echo "❌ $sha  $subject"
              echo "     missing 'Signed-off-by' trailer (author: $author)"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo ""
            echo "One or more commits are missing a DCO sign-off."
            echo "Sign off at commit time — 'dev' and 'main' forbid force-pushes, so a"
            echo "pushed commit cannot be signed retroactively."
            echo "  git config core.hooksPath .githooks   # once per clone, then it is automatic"
            echo "  git commit -s                         # or sign by hand"
            echo "On an unpushed branch:  git rebase --signoff ${BASE_SHA} && git push --force-with-lease"
            echo "See CONTRIBUTING.md for details."
            exit 1
          fi
          echo "All commits are signed off. 🎉"

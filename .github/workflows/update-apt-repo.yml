name: Update APT Repository

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  update-apt-repo:
    name: Update APT Repository
    runs-on: ubuntu-latest

    steps:
      - name: Checkout apt-repo branch
        uses: actions/checkout@v4
        with:
          ref: apt-repo
          path: apt-repo

      - name: Install reprepro
        run: sudo apt-get install -y reprepro

      - name: Import GPG signing key
        run: |
          echo "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import

      - name: Get release tag
        id: tag
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag }}"
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download .deb from release
        run: |
          gh release download ${{ steps.tag.outputs.TAG }} \
            --pattern "*.deb" \
            --dir /tmp/debs
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set GPG key ID in reprepro config
        working-directory: apt-repo
        run: |
          sed -i "s|SignWith:.*|SignWith: ${{ secrets.APT_GPG_KEY_ID }}|" conf/distributions

      - name: Add .deb packages to repository
        working-directory: apt-repo
        run: |
          for deb in /tmp/debs/*.deb; do
            reprepro -b . includedeb stable "$deb"
          done

      - name: Commit and push
        working-directory: apt-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Add packages for ${{ steps.tag.outputs.TAG }}"
          git push

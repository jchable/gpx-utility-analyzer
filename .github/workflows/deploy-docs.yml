name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'cli/README.md'
      - 'cli/docs/**'
      - 'ai-analyzer/README.md'
      - 'ai-analyzer/docs/**'
      - 'README.md'
      - '.github/workflows/deploy-docs.yml'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: Checkout apt-repo branch
        uses: actions/checkout@v7
        continue-on-error: true
        with:
          ref: apt-repo
          path: apt-repo-content

      - name: Include APT repo in deployment
        working-directory: ${{ github.workspace }}
        run: |
          if [ -d apt-repo-content ]; then
            mkdir -p docs/build/apt
            cp -r apt-repo-content/. docs/build/apt/
          fi

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

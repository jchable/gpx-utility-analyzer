name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Cancel in-progress runs for the same ref (e.g. new push to a PR)
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_VERSION: '9.0.x'
  NODE_VERSION: '22'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  # ────────────────────────────────────────────────────────────────
  # .NET — CLI
  # ────────────────────────────────────────────────────────────────
  cli:
    name: .NET CLI (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore cli/GpxAnalyzer.Cli.sln
      - name: Build
        run: dotnet build cli/GpxAnalyzer.Cli.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test cli/tests/GpxAnalyzer.Cli.Tests/GpxAnalyzer.Cli.Tests.csproj --configuration Release --no-build --verbosity normal

  # ────────────────────────────────────────────────────────────────
  # .NET — AI analyzer
  # ────────────────────────────────────────────────────────────────
  ai-analyzer:
    name: .NET AI analyzer (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ai-analyzer/tests/GpxAiAnalyzer.Tests/GpxAiAnalyzer.Tests.csproj
      - name: Build
        run: dotnet build ai-analyzer/src/GpxAiAnalyzer/GpxAiAnalyzer.csproj --configuration Release
      - name: Test
        run: dotnet test ai-analyzer/tests/GpxAiAnalyzer.Tests/GpxAiAnalyzer.Tests.csproj --configuration Release --verbosity normal

  # ────────────────────────────────────────────────────────────────
  # .NET — Web API (integration tests)
  # ────────────────────────────────────────────────────────────────
  api:
    name: ASP.NET Core API (build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore ui/api.Tests/GpxAnalyzer.Api.Tests.csproj
      - name: Build
        run: dotnet build ui/api/GpxAnalyzer.Api.csproj --configuration Release
      - name: Test
        run: dotnet test ui/api.Tests/GpxAnalyzer.Api.Tests.csproj --configuration Release --verbosity normal

  # ────────────────────────────────────────────────────────────────
  # React client — lint + build
  # ────────────────────────────────────────────────────────────────
  client:
    name: React client (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/client/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  # ────────────────────────────────────────────────────────────────
  # React client — Playwright E2E (mocked API, runs against preview build)
  # ────────────────────────────────────────────────────────────────
  e2e:
    name: Client E2E (Playwright)
    runs-on: ubuntu-latest
    needs: client
    defaults:
      run:
        working-directory: ui/client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/client/package-lock.json
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Build
        run: npm run build
      - name: Run E2E tests
        run: npm run e2e
      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: ui/client/e2e-report/
          retention-days: 7
          if-no-files-found: ignore
